name: release

on:
  push:
    tags: ["v*"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"
      - run: bun install
      - run: bun typecheck
      - run: bun turbo test --output-logs=errors-only --log-order=grouped --filter='!@opencode-ai/app' --filter='!@opencode-ai/web' --filter='!@opencode-ai/ui' --filter='!@opencode-ai/desktop' --filter='!@opencode-ai/console-app'

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"
      - run: bun install
      - name: Build plugin
        run: bun build packages/opencode/plugins/kairos/index.ts --outdir=packages/opencode/plugins/kairos/ --target=bun
      - name: Create source tarball
        run: git archive --format=tar.gz --output=kairos.tar.gz HEAD
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Kairos ${{ github.ref_name }}"
          generate_release_notes: true
          files: |
            kairos.tar.gz
            packages/opencode/plugins/kairos/index.js
